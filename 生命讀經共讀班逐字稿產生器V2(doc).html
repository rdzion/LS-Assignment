<script>
/* ============================================================
   工具函式
   ============================================================ */

// 計算字數：排除標點符號（含中文標點）與所有空白字元
function countChars(text) {
  if (!text) return 0;
  const stripped = text.replace(/[\s\p{P}\p{S}]/gu, "");
  return stripped.length;
}

// 預估時間（分鐘）＝ 字數 / 160，四捨五入
function estimateMinutes(charCount) {
  return Math.round(charCount / 160);
}

// 將內文依「換行」切成段落，過濾空白行
function splitParagraphs(text) {
  return text
    .split(/\r?\n/)
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

// 將段落陣列平均分配為 numChunks 個區塊（盡量平均，餘數依序分配給前面的區塊）
function splitIntoChunks(paragraphs, numChunks) {
  const chunks = Array.from({ length: numChunks }, () => []);
  const total = paragraphs.length;

  if (total === 0) {
    return chunks.map(() => "");
  }

  const base = Math.floor(total / numChunks);
  const remainder = total % numChunks;

  let idx = 0;
  for (let i = 0; i < numChunks; i++) {
    let count = base + (i < remainder ? 1 : 0);
    for (let j = 0; j < count; j++) {
      if (idx < total) chunks[i].push(paragraphs[idx++]);
    }
  }
  return chunks.map(c => c.join("\n\n"));
}

function getFormData() {
  return {
    bookTitle: document.getElementById("bookTitle").value.trim(),
    verseRef: document.getElementById("verseRef").value.trim(),
    partner1: document.getElementById("partner1").value.trim(),
    partner2: document.getElementById("partner2").value.trim(),
    partner3: document.getElementById("partner3").value.trim(),
    verseText: document.getElementById("verseText").value.trim(),
    introText: document.getElementById("introText").value.trim(),
    mainText: document.getElementById("mainText").value.trim()
  };
}

function showAlert(msg) {
  const box = document.getElementById("alertBox");
  box.textContent = msg;
  box.style.display = "block";
  box.scrollIntoView({ behavior: "smooth", block: "center" });
}

function hideAlert() {
  document.getElementById("alertBox").style.display = "none";
}

function escapeHtml(str) {
  return (str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* ============================================================
   即時統計（字數 / 預估時間）
   ============================================================ */

function refreshStats() {
  const mainText = document.getElementById("mainText").value;
  const charCount = countChars(mainText);
  const minutes = estimateMinutes(charCount);
  const paragraphs = splitParagraphs(mainText);

  const statsArea = document.getElementById("statsArea");
  statsArea.innerHTML = `
    <span class="stat-pill">📝 內文字數 <span class="val">${charCount}</span> 字</span>
    <span class="stat-pill">⏱ 預估朗讀時間 <span class="val">${minutes}</span> 分鐘</span>
    <span class="stat-pill">📄 段落數 <span class="val">${paragraphs.length}</span> 段</span>
  `;
}

document.getElementById("mainText").addEventListener("input", refreshStats);
window.addEventListener("DOMContentLoaded", refreshStats);

/* ============================================================
   分配預覽（畫面上的預覽卡片，使用一般 DOM／HTML，與匯出邏輯分開）
   ============================================================ */

function buildAssignmentPlan(data) {
  const paragraphs = splitParagraphs(data.mainText);
  const chunks = splitIntoChunks(paragraphs, 6);

  // 依題目需求的固定分配順序
  const plan = [
    { speaker: data.partner2, label: "用靈宣讀", content: chunks[0], key: "chunk1" },
    { speaker: data.partner3, label: "用靈宣讀", content: chunks[1], key: "chunk2" },
    { speaker: data.partner1, label: "用靈宣讀", content: chunks[2], key: "chunk3" },
    { speaker: data.partner2, label: "用靈分享信息重點", content: "（請於此處填寫要點分享內容，建議 1～2 點，並請於共讀當日中午前繳交申言稿）", key: "share1" },
    { speaker: data.partner2, label: "用靈宣讀", content: chunks[3], key: "chunk4" },
    { speaker: data.partner3, label: "用靈宣讀", content: chunks[4], key: "chunk5" },
    { speaker: data.partner1, label: "用靈宣讀", content: chunks[5], key: "chunk6" },
    { speaker: data.partner3, label: "用靈分享信息重點", content: "（請於此處填寫要點分享內容，建議 1～2 點，並請於共讀當日中午前繳交申言稿）", key: "share2" }
  ];

  return { chunks, plan };
}

function renderPreview(data, plan) {
  const previewCard = document.getElementById("previewCard");
  const previewArea = document.getElementById("previewArea");
  previewCard.style.display = "block";

  let html = "";
  plan.forEach(item => {
    const speaker = item.speaker || "（未填寫配搭姓名）";
    html += `
      <div class="preview-chunk">
        <span class="speaker-tag">${speaker} ${item.label}</span>
        <div class="chunk-text">${escapeHtml(item.content) || "（無內容）"}</div>
      </div>
    `;
  });
  previewArea.innerHTML = html;
}

/* ============================================================
   Word（.doc）產生 —— 純 HTML 轉 Word 離線方案
   ------------------------------------------------------------
   做法：把逐字稿排版成一段帶有 Word 專用 XML 命名空間與內嵌樣式的
   HTML 字串，再用 Blob 包裝並指定 MIME 類型 application/msword，
   讓瀏覽器直接下載成 .doc 檔。Word 會用內建的「HTML 篩選器」開啟並
   轉換成一般 Word 文件，不需要任何外部 JavaScript 函式庫，
   也完全不受網路連線或瀏覽器外掛影響。
   ============================================================ */

// 依換行切成多個 <p>，每一行各自成一段（空行仍保留段落間距）
function htmlParagraphs(text, opts) {
  opts = opts || {};
  const italicStyle = opts.italics ? "font-style:italic;" : "";
  const lines = (text || "").split(/\r?\n/);
  return lines
    .map(line => {
      const content = line.length ? escapeHtml(line) : "&nbsp;";
      return `<p style="margin:0 0 10pt 0;font-size:11pt;line-height:1.6;${italicStyle}">${content}</p>`;
    })
    .join("\n");
}

function speakerHeadingHtml(text) {
  return `<p style="margin:18pt 0 6pt 0;"><b><span style="color:#4A6FA5;font-size:12pt;">${escapeHtml(text)}</span></b></p>`;
}

function sectionHeadingHtml(text) {
  return `<p style="margin:24pt 0 10pt 0;padding-bottom:4pt;font-size:14pt;font-weight:bold;color:#2C3E50;border-bottom:1pt solid #4A6FA5;">${escapeHtml(text)}</p>`;
}

function bulletLineHtml(text) {
  return `<p style="margin:0 0 6pt 0;font-size:11pt;">• ${escapeHtml(text)}</p>`;
}

function buildWordHtmlBody(data, charCount, minutes, plan) {
  let body = "";

  // 標題
  body += `<h1 style="text-align:center;color:#2C3E50;font-size:20pt;margin:0 0 6pt 0;">${escapeHtml(data.bookTitle || "生命讀經共讀班")}</h1>`;
  body += `<p style="text-align:center;color:#4A6FA5;font-style:italic;font-size:12pt;margin:0 0 20pt 0;">${escapeHtml(data.verseRef || "")}</p>`;

  // 抬頭預備資訊
  body += sectionHeadingHtml("抬頭預備資訊");
  body += bulletLineHtml(`本次配搭人位及順序：${data.partner1}、${data.partner2}、${data.partner3}`);
  body += bulletLineHtml(`本篇文本字數約 ${charCount} 字（不含標點符號與空白）。`);
  body += bulletLineHtml(`本次安排 2 次分享。包括開頭提醒及結尾禱告，本文預估約 ${minutes} 分鐘。（以 160 字／分鐘計算）`);

  // 聚會開始
  body += sectionHeadingHtml("聚會開始（以下為本次逐字稿文本）");

  // 1. 用靈提醒、禱告並宣讀經文
  body += speakerHeadingHtml(`${data.partner1} 用靈提醒、禱告並宣讀經文`);
  body += htmlParagraphs(
    `弟兄姊妹們晚安，我們準備開始今天晚上的共讀班，開頭先簡單的自我介紹，我是${data.partner1}、我是${data.partner2}、我是${data.partner3}，歡迎弟兄姊妹一起上線共讀。\n1. 請弟兄姊妹更改顯示名稱為「會所－大區－小區－姓名」的格式。\n2. 請弟兄姊妹預備「恢復本聖經」及本次讀經內容，跟著我們一同進入神豐盛的生命。\n3. ${data.partner1} 開頭禱告（請自行預備禱告內容）`
  );

  // 2. 宣讀經文
  body += speakerHeadingHtml(`${data.partner1} 宣讀經文`);
  body += htmlParagraphs(`請大家翻開恢復本聖經【${data.verseRef}】，我們可以同聲宣讀今日的經節～`);
  body += htmlParagraphs(data.verseText);

  // 3. 前言回顧與連結
  body += speakerHeadingHtml(`${data.partner1} 前言回顧與連結`);
  body += htmlParagraphs(data.introText);

  // 4~11. 依固定順序輸出朗讀 / 分享段落
  plan.forEach(item => {
    body += speakerHeadingHtml(`${item.speaker} ${item.label}`);
    body += htmlParagraphs(item.content, { italics: item.key.startsWith("share") });
  });

  // 結尾禱告
  body += speakerHeadingHtml(`${data.partner1} 用靈結尾禱告與晚安`);
  body += htmlParagraphs(
    `${data.partner1} 結尾禱告（請自行預備禱告內容）\n\n感謝主，我們今天的共讀班就停在這邊，下週同一時間，歡迎弟兄姊妹們再一同上線共讀，晚安！`
  );

  return body;
}

function buildWordDocument(data, charCount, minutes, plan) {
  const bodyHtml = buildWordHtmlBody(data, charCount, minutes, plan);
  const title = escapeHtml(data.bookTitle || "生命讀經共讀班");

  // xmlns:o / xmlns:w 是 Word 專用的 XML 命名空間，讓 Word 的 HTML
  // 篩選器能正確識別這是一份要用 Word 開啟、以「列印模式」呈現的文件。
  return `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>${title}</title>
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
<w:View>Print</w:View>
<w:Zoom>100</w:Zoom>
<w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml>
<![endif]-->
<style>
  @page { size: 21cm 29.7cm; margin: 2.5cm 2cm; }
  body { font-family: "Microsoft JhengHei", "PMingLiU", "Noto Sans TC", sans-serif; font-size: 11pt; color:#333333; line-height:1.6; }
</style>
</head>
<body>
${bodyHtml}
</body>
</html>`;
}

// 用 Blob + 隱藏的 <a download> 觸發下載，不需要 FileSaver.js。
function downloadAsWordDoc(htmlString, fileName) {
  // 開頭加入 UTF-8 BOM（﻿），幫助 Word 正確判斷中文編碼。
  const blob = new Blob(["﻿", htmlString], { type: "application/msword" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ============================================================
   主流程
   ============================================================ */

function validate(data) {
  const required = [
    ["bookTitle", "共讀書名與篇題"],
    ["verseRef", "聖經經節"],
    ["partner1", "配搭 1（主持人）"],
    ["partner2", "配搭 2"],
    ["partner3", "配搭 3"],
    ["mainText", "生命讀經完整內文"]
  ];
  const missing = required.filter(([key]) => !data[key]).map(([, label]) => label);
  return missing;
}

function safeFileName(name) {
  return (name || "生命讀經共讀班逐字稿").replace(/[\\/:*?"<>|]/g, "").slice(0, 60);
}

function generateAll() {
  hideAlert();
  const data = getFormData();

  const missing = validate(data);
  if (missing.length > 0) {
    showAlert("請先填寫以下必填欄位：" + missing.join("、"));
    return;
  }

  const charCount = countChars(data.mainText);
  const minutes = estimateMinutes(charCount);
  const { plan } = buildAssignmentPlan(data);

  renderPreview(data, plan);

  const btn = document.getElementById("generateBtn");
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = "⏳ 產生中，請稍候...";

  try {
    const htmlString = buildWordDocument(data, charCount, minutes, plan);
    const today = new Date();
    const dateStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, "0")}${String(today.getDate()).padStart(2, "0")}`;
    const fileName = `${dateStr}_${safeFileName(data.bookTitle)}.doc`;
    downloadAsWordDoc(htmlString, fileName);
  } catch (err) {
    console.error(err);
    showAlert("產生 Word 檔時發生錯誤：" + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}
</script>
