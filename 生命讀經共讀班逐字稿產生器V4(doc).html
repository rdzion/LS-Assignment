<!--

  瀏覽器就會把它下載成 .doc 檔。Word 開啟 .doc 附檔名的 HTML 內容時，會用內建的

<script>
/* ============================================================
   常數：人位選項
   ============================================================ */
const SPEAKER_OPTIONS = [
  { key: "partner1", label: "配搭1" },
  { key: "partner2", label: "配搭2" },
  { key: "partner3", label: "配搭3" },

  { key: "endShare",  label: "結尾分享" },
  { key: "openPray",  label: "開頭禱告" },
  { key: "closePray", label: "結尾禱告" }
];

// 貼上內文後，6 段的預設人位順序（可再自行於下拉選單調整）
const DEFAULT_SPLIT_SPEAKERS = ["partner2", "partner3", "partner1", "partner2", "partner3", "partner1"];

// 姓名 → 會所 對照表（依北投大區共讀夜間班輪值表建立）。
// 使用者填入配搭姓名後，若在此表中找到完全相符的姓名，會自動帶入對應會所。
const NAME_TO_HALL = {
  // 週一
  "謝正男": "H61", "周博恩": "H112", "陳柏安": "H81", "潘仰信": "H79",
  "謝恩": "H12", "李福軒": "H79", "曾守榮": "H112", "簡逸豪": "H12",
  "黃梓恆": "H81", "林鴻偉": "H36",
  // 週二
  "吳笙宇": "H12", "張毅全": "H60", "方恩斌": "H112", "鍾禹鋒": "H81",
  "賴巍中": "H61", "呂德安": "H81", "李罕衷": "H61", "陸湧元": "H12",
  "倪耀恩": "H61",
  // 週三
  "李讓": "H12", "陳劭甫": "H112", "鄭緯綸": "H37", "劉立煊": "H12",
  "彭益景": "H12", "徐偉倫": "H61", "張宏恩": "H81", "趙鈺容": "H61",
  "程旭弘": "H81", "蔡溢恩": "H81", "朱真儀": "H12",
  // 週四
  "王晨維": "H60", "楊明敏": "H61", "范庭欣": "H12", "廖健智": "H81",
  "劉立城": "H79", "陳子傑": "H36", "林建銘": "H61", "黃主業": "H81",
  "楊崇榮": "H61", "陳亭旭": "H36", "高聖傑": "H60"
};

/* ============================================================
   工具函式
   ============================================================ */

// 計算字數：排除標點符號（含中文標點）與所有空白字元
function countChars(text) {
  if (!text) return 0;
  const stripped = text.replace(/[\s\p{P}\p{S}]/gu, "");
  return stripped.length;
}

// 預估時間（分鐘）＝ 字數 / 160，四捨五入
function estimateMinutes(charCount) {
  return Math.round(charCount / 160);
}

// 將內文依「換行」切成段落，過濾空白行
function splitParagraphs(text) {
  return text
    .split(/\r?\n/)
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

// 將段落陣列平均分配為 numChunks 個區塊（盡量平均，餘數依序分配給前面的區塊）
function splitParagraphsIntoChunks(paragraphs, numChunks) {
  const chunks = Array.from({ length: numChunks }, () => []);
  const total = paragraphs.length;
  if (total === 0) return chunks.map(() => "");

  const base = Math.floor(total / numChunks);
  const remainder = total % numChunks;

  let idx = 0;
  for (let i = 0; i < numChunks; i++) {
    let count = base + (i < remainder ? 1 : 0);
    for (let j = 0; j < count; j++) {
      if (idx < total) chunks[i].push(paragraphs[idx++]);
    }
  }
  return chunks.map(c => c.join("\n\n"));
}

// 依字元數平均切分（用於貼上內容沒有足夠換行分段時的備援方案），
// 會盡量在句尾標點或換行處斷開，避免斷在句子中間。
function splitByCharsEvenly(text, numChunks) {
  const cleaned = (text || "").trim();
  if (!cleaned) return Array(numChunks).fill("");

  const total = cleaned.length;
  const target = Math.ceil(total / numChunks);
  const breakChars = ["\n", "。", "！", "？", "，", "；"];
  const window = 60;

  const result = [];
  let start = 0;
  for (let i = 0; i < numChunks; i++) {
    if (i === numChunks - 1 || start >= total) {
      result.push(cleaned.slice(start).trim());
      start = total;
      continue;
    }
    const idealEnd = Math.min(start + target, total);
    let cut = -1;
    for (let w = 0; w <= window && idealEnd + w < total; w++) {
      if (breakChars.includes(cleaned[idealEnd + w])) { cut = idealEnd + w + 1; break; }
    }
    if (cut === -1) {
      for (let w = 0; w <= window && idealEnd - w > start; w++) {
        if (breakChars.includes(cleaned[idealEnd - w])) { cut = idealEnd - w + 1; break; }
      }
    }
    const end = cut !== -1 ? cut : idealEnd;
    result.push(cleaned.slice(start, end).trim());
    start = end;
  }
  return result;
}

// 主要的「自動預設分段」邏輯：先嘗試依段落（換行）分組平均分配；
// 若段落數不足 numChunks，改用字元數平均切分作為備援。
function autoSplitToChunks(text, numChunks) {
  const paragraphs = splitParagraphs(text);
  if (paragraphs.length >= numChunks) {
    return splitParagraphsIntoChunks(paragraphs, numChunks);
  }
  return splitByCharsEvenly(text, numChunks);
}

// 阿拉伯數字轉中文數字（支援 0~9999，足夠應付篇數編號）
function toChineseNum(numStr) {
  const digits = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
  const units = ["", "十", "百", "千"];
  const n = parseInt(numStr, 10);
  if (isNaN(n) || n < 0) return numStr;
  if (n === 0) return "零";

  const str = String(n);
  const len = str.length;
  let result = "";
  for (let i = 0; i < len; i++) {
    const d = parseInt(str[i], 10);
    const unitIdx = len - i - 1;
    if (d !== 0) {
      if (d === 1 && unitIdx === 1 && len === 2) {
        result += units[unitIdx];               // 十一、十二…（不寫成「一十」）
      } else {
        result += digits[d] + units[unitIdx];
      }
    } else if (result && !result.endsWith("零") && i !== len - 1) {
      result += "零";
    }
  }
  return result.replace(/零+$/, "");
}

// 篇數欄位：若使用者輸入純數字，自動轉為中文數字；若已輸入中文數字則原樣使用
function formatChapterNum(raw) {
  const trimmed = (raw || "").trim();
  if (!trimmed) return "";
  return /^\d+$/.test(trimmed) ? toChineseNum(trimmed) : trimmed;
}

// 組合「共讀書名與篇題」的完整顯示文字
function bookTitleDisplay(data) {
  const chapter = formatChapterNum(data.chapterNum);
  let title = `${data.bookName || ""}生命讀經`;
  if (chapter) title += `－第${chapter}篇`;
  if (data.chapterTitle) title += ` ${data.chapterTitle}`;
  return title.trim();
}

function escapeHtml(str) {
  return (str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* ============================================================
   人位標籤顯示邏輯
   ============================================================ */

// 依配搭 key（partner1/2/3）組合「會所＋姓名＋弟兄」的顯示文字
function partnerDisplay(key, data) {
  const nameMap = { partner1: data.partner1Name, partner2: data.partner2Name, partner3: data.partner3Name };
  const hallMap = { partner1: data.partner1Hall, partner2: data.partner2Hall, partner3: data.partner3Hall };
  const fallback = { partner1: "配搭1", partner2: "配搭2", partner3: "配搭3" };
  const name = (nameMap[key] || "").trim();
  const hall = (hallMap[key] || "").trim();
  if (!name) return fallback[key] || key;
  return `${hall}${name}弟兄`;
}

// 依人位 key 取得匯出時使用的標題文字
function speakerHeadingText(key, data) {
  switch (key) {
    case "partner1": return `${partnerDisplay("partner1", data)} 用靈宣讀`;
    case "partner2": return `${partnerDisplay("partner2", data)} 用靈宣讀`;
    case "partner3": return `${partnerDisplay("partner3", data)} 用靈宣讀`;
    case "midShare": return "中間分享";
    case "endShare": return "結尾分享";
    case "openPray": return "開頭禱告";
    case "closePray": return "結尾禱告";
    default: return key;
  }
}

function speakerOptionsHtml(selectedKey) {
  return SPEAKER_OPTIONS.map(opt =>
    `<option value="${opt.key}"${opt.key === selectedKey ? " selected" : ""}>${opt.label}</option>`
  ).join("");
}

/* ============================================================
   基本資料：標題預覽 &amp; 姓名→會所 自動帶入
   ============================================================ */

function refreshTitlePreview() {
  const data = {
    bookName: document.getElementById("bookName").value.trim(),
    chapterNum: document.getElementById("chapterNum").value.trim(),
    chapterTitle: document.getElementById("chapterTitle").value.trim()
  };
  const display = bookTitleDisplay(data);
  document.getElementById("titlePreview").textContent =
    "預覽：" + (display && display !== "生命讀經" ? display : "（尚未填寫）");
}

["bookName", "chapterNum", "chapterTitle"].forEach(id => {
  document.getElementById(id).addEventListener("input", refreshTitlePreview);
});

["partner1", "partner2", "partner3"].forEach(key => {
  const nameEl = document.getElementById(key + "Name");
  const hallEl = document.getElementById(key + "Hall");
  nameEl.addEventListener("input", () => {
    const matched = NAME_TO_HALL[nameEl.value.trim()];
    if (matched) hallEl.value = matched;
  });
});

window.addEventListener("DOMContentLoaded", refreshTitlePreview);

/* ============================================================
   段落卡片狀態管理
   ============================================================ */

let segments = [];   // { id, speaker, text }
let idCounter = 1;
let dragSrcId = null;

function createSegment(speaker, text) {
  return { id: idCounter++, speaker: speaker || "partner1", text: text || "" };
}

function renderSegments() {
  const container = document.getElementById("segmentsContainer");
  const emptyHint = document.getElementById("emptyHint");

  if (segments.length === 0) {
    container.innerHTML = "";
    emptyHint.style.display = "block";
    updateStats();
    return;
  }
  emptyHint.style.display = "none";

  container.innerHTML = segments.map((seg, index) => `
    <div class="segment-card" data-id="${seg.id}">
      <div class="segment-card-header">
        <span class="drag-handle" draggable="true" title="拖曳調整順序">⠿⠿</span>
        <span class="segment-order-badge">${index + 1}</span>
        <select class="form-control speaker-select" data-role="speaker">
          ${speakerOptionsHtml(seg.speaker)}
        </select>
        <span class="spacer"></span>
        <button type="button" class="btn-danger-outline" data-action="delete">🗑 刪除此段</button>
      </div>
      <textarea class="form-control segment-text" data-role="text" rows="4" placeholder="請輸入本段朗讀／分享內文">${escapeHtml(seg.text)}</textarea>
      <div class="segment-charcount" data-role="charcount">字數：${countChars(seg.text)}</div>
    </div>
  `).join("");

  updateStats();
}

function updateStats() {
  const total = segments.reduce((sum, s) => sum + countChars(s.text), 0);
  const minutes = estimateMinutes(total);
  const statsArea = document.getElementById("statsArea");
  statsArea.innerHTML = `
    <span class="stat-pill">📄 段落數 <span class="val">${segments.length}</span> 段</span>
    <span class="stat-pill">📝 內文總字數 <span class="val">${total}</span> 字</span>
    <span class="stat-pill">⏱ 預估朗讀時間 <span class="val">${minutes}</span> 分鐘</span>
  `;
}

/* ---------- 事件委派：輸入 / 選單 / 刪除 ---------- */

function findSegmentByCardEl(el) {
  const card = el.closest(".segment-card");
  if (!card) return null;
  const id = Number(card.dataset.id);
  return segments.find(s => s.id === id);
}

document.getElementById("segmentsContainer").addEventListener("input", (e) => {
  if (e.target.dataset.role === "text") {
    const seg = findSegmentByCardEl(e.target);
    if (!seg) return;
    seg.text = e.target.value;
    const card = e.target.closest(".segment-card");
    const counter = card.querySelector('[data-role="charcount"]');
    if (counter) counter.textContent = `字數：${countChars(seg.text)}`;
    updateStats();
  }
});

document.getElementById("segmentsContainer").addEventListener("change", (e) => {
  if (e.target.dataset.role === "speaker") {
    const seg = findSegmentByCardEl(e.target);
    if (!seg) return;
    seg.speaker = e.target.value;
  }
});

document.getElementById("segmentsContainer").addEventListener("click", (e) => {
  const btn = e.target.closest('[data-action="delete"]');
  if (!btn) return;
  const seg = findSegmentByCardEl(btn);
  if (!seg) return;
  segments = segments.filter(s => s.id !== seg.id);
  renderSegments();
});

/* ---------- 拖曳排序（純 HTML5 Drag and Drop API） ---------- */

const segContainerEl = document.getElementById("segmentsContainer");

segContainerEl.addEventListener("dragstart", (e) => {
  const handle = e.target.closest(".drag-handle");
  if (!handle) return;
  const card = handle.closest(".segment-card");
  if (!card) return;
  dragSrcId = Number(card.dataset.id);
  card.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setDragImage(card, 20, 20); } catch (err) { /* 忽略不支援的瀏覽器 */ }
});

segContainerEl.addEventListener("dragover", (e) => {
  if (dragSrcId === null) return;
  e.preventDefault();
  const card = e.target.closest(".segment-card");
  if (!card) return;
  card.classList.add("drag-over");
});

segContainerEl.addEventListener("dragleave", (e) => {
  const card = e.target.closest(".segment-card");
  if (card) card.classList.remove("drag-over");
});

segContainerEl.addEventListener("drop", (e) => {
  e.preventDefault();
  const card = e.target.closest(".segment-card");
  if (!card || dragSrcId === null) return;
  const targetId = Number(card.dataset.id);
  card.classList.remove("drag-over");
  if (targetId !== dragSrcId) {
    const fromIdx = segments.findIndex(s => s.id === dragSrcId);
    const toIdx = segments.findIndex(s => s.id === targetId);
    if (fromIdx !== -1 && toIdx !== -1) {
      const [moved] = segments.splice(fromIdx, 1);
      segments.splice(toIdx, 0, moved);
      renderSegments();
    }
  }
});

segContainerEl.addEventListener("dragend", () => {
  dragSrcId = null;
  segContainerEl.querySelectorAll(".segment-card").forEach(c => {
    c.classList.remove("dragging", "drag-over");
  });
});

/* ---------- 「貼入文字並自動預設分段」／「新增段落」 ---------- */

document.getElementById("splitBtn").addEventListener("click", () => {
  const raw = document.getElementById("pasteText").value.trim();
  if (!raw) {
    showAlert("請先在上方貼上生命讀經內文，再進行自動分段。");
    return;
  }
  if (segments.length > 0) {
    const ok = confirm("此操作將取代目前所有段落卡片內容，是否繼續？");
    if (!ok) return;
  }
  hideAlert();
  const chunks = autoSplitToChunks(raw, 6);
  segments = chunks.map((chunk, i) => createSegment(DEFAULT_SPLIT_SPEAKERS[i] || "partner1", chunk));
  renderSegments();
});

document.getElementById("addSegmentBtn").addEventListener("click", () => {
  segments.push(createSegment("partner1", ""));
  renderSegments();
  const cards = segContainerEl.querySelectorAll(".segment-card");
  const last = cards[cards.length - 1];
  if (last) {
    const ta = last.querySelector("textarea.segment-text");
    if (ta) ta.focus();
    last.scrollIntoView({ behavior: "smooth", block: "center" });
  }
});

window.addEventListener("DOMContentLoaded", renderSegments);

/* ============================================================
   Word（.doc）產生 —— 純 HTML 轉 Word 離線方案
   ------------------------------------------------------------
   做法：把逐字稿排版成一段帶有 Word 專用 XML 命名空間與內嵌樣式的
   HTML 字串，再用 Blob 包裝並指定 MIME 類型 application/msword，
   讓瀏覽器直接下載成 .doc 檔。Word 會用內建的「HTML 篩選器」開啟並
   轉換成一般 Word 文件，不需要任何外部 JavaScript 函式庫，
   也完全不受網路連線或瀏覽器外掛影響。
   ============================================================ */

// 依換行切成多個 <p>，每一行各自成一段（空行仍保留段落間距）
function htmlParagraphs(text, opts) {
  opts = opts || {};
  const italicStyle = opts.italics ? "font-style:italic;" : "";
  const lines = (text || "").split(/\r?\n/);
  return lines
    .map(line => {
      const content = line.length ? escapeHtml(line) : "&nbsp;";
      return `<p style="margin:0 0 10pt 0;font-size:11pt;line-height:1.6;${italicStyle}">${content}</p>`;
    })
    .join("\n");
}

// 人位標籤：依需求加上黃色螢光標記（highlight），模擬螢光筆效果
function speakerHeadingHtml(text) {
  return `<p style="margin:18pt 0 6pt 0;"><b><span style="background-color:#FFFF00;mso-highlight:yellow;color:#000000;font-size:12pt;padding:1pt 2pt;">${escapeHtml(text)}</span></b></p>`;
}

function sectionHeadingHtml(text) {
  return `<p style="margin:24pt 0 10pt 0;padding-bottom:4pt;font-size:14pt;font-weight:bold;color:#2C3E50;border-bottom:1pt solid #4A6FA5;">${escapeHtml(text)}</p>`;
}

function bulletLineHtml(text) {
  return `<p style="margin:0 0 6pt 0;font-size:11pt;">• ${escapeHtml(text)}</p>`;
}

function buildWordHtmlBody(data, charCount, minutes, segs) {
  let body = "";

  const titleText = bookTitleDisplay(data);
  const p1 = partnerDisplay("partner1", data);
  const p2 = partnerDisplay("partner2", data);
  const p3 = partnerDisplay("partner3", data);

  // 標題
  body += `<h1 style="text-align:center;color:#2C3E50;font-size:20pt;margin:0 0 6pt 0;">${escapeHtml(titleText || "生命讀經共讀班")}</h1>`;
  body += `<p style="text-align:center;color:#4A6FA5;font-style:italic;font-size:12pt;margin:0 0 20pt 0;">${escapeHtml(data.verseRef || "")}</p>`;

  // 抬頭預備資訊
  body += sectionHeadingHtml("抬頭預備資訊");
  body += bulletLineHtml(`本次配搭人位及順序：${p1}、${p2}、${p3}`);
  body += bulletLineHtml(`本篇文本字數約 ${charCount} 字（不含標點符號與空白）。`);
  body += bulletLineHtml(`本次共 ${segs.length} 個朗讀／分享段落，本文預估約 ${minutes} 分鐘。（以 160 字／分鐘計算）`);

  // 聚會開始
  body += sectionHeadingHtml("聚會開始（以下為本次逐字稿文本）");

  // 1. 用靈提醒、禱告並宣讀經文
  body += speakerHeadingHtml(`${p1} 用靈提醒、禱告並宣讀經文`);
  body += htmlParagraphs(
    `弟兄姊妹們晚安，我們準備開始今天晚上的共讀班，開頭先簡單的自我介紹，我是${p1}、我是${p2}、我是${p3}，歡迎弟兄姊妹一起上線共讀。\n1. 請弟兄姊妹更改顯示名稱為「會所－大區－小區－姓名」的格式。\n2. 請弟兄姊妹預備「恢復本聖經」及本次讀經內容，跟著我們一同進入神豐盛的生命。\n3. ${p1} 開頭禱告（請自行預備禱告內容）`
  );

  // 2. 宣讀經文
  body += speakerHeadingHtml(`${p1} 宣讀經文`);
  body += htmlParagraphs(`請大家翻開恢復本聖經【${data.verseRef}】，我們可以同聲宣讀今日的經節～`);
  body += htmlParagraphs(data.verseText);

  // 3. 前言回顧與連結（此項非規劃者的工作，網頁不提供輸入欄位，匯出時留白提示）
  body += speakerHeadingHtml(`${p1} 前言回顧與連結`);
  body += htmlParagraphs("（請主持人依當日情況，自行預備本次前言回顧，並連結今日經節與綱要內容）");

  // 4~N. 依使用者排序後的段落卡片輸出
  segs.forEach(seg => {
    const heading = speakerHeadingText(seg.speaker, data);
    const isShareOrPray = seg.speaker === "midShare" || seg.speaker === "endShare" ||
                           seg.speaker === "openPray" || seg.speaker === "closePray";
    body += speakerHeadingHtml(heading);
    body += htmlParagraphs(seg.text, { italics: isShareOrPray });
  });

  // 結尾
  body += speakerHeadingHtml(`${p1} 結束語`);
  body += htmlParagraphs(
    `感謝主，我們今天的共讀班就停在這邊，下週同一時間，歡迎弟兄姊妹們再一同上線共讀，晚安！`
  );

  return body;
}

function buildWordDocument(data, charCount, minutes, segs) {
  const bodyHtml = buildWordHtmlBody(data, charCount, minutes, segs);
  const title = escapeHtml(bookTitleDisplay(data) || "生命讀經共讀班");

  // xmlns:o / xmlns:w 是 Word 專用的 XML 命名空間，讓 Word 的 HTML
  // 篩選器能正確識別這是一份要用 Word 開啟、以「列印模式」呈現的文件。
  return `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>${title}</title>
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
<w:View>Print</w:View>
<w:Zoom>100</w:Zoom>
<w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml>
<![endif]-->
<style>
  @page { size: 21cm 29.7cm; margin: 2.5cm 2cm; }
  body { font-family: "Microsoft JhengHei", "PMingLiU", "Noto Sans TC", sans-serif; font-size: 11pt; color:#333333; line-height:1.6; }
</style>
</head>
<body>
${bodyHtml}
</body>
</html>`;
}

// 用 Blob + 隱藏的 <a download> 觸發下載，不需要 FileSaver.js。
function downloadAsWordDoc(htmlString, fileName) {
  // 開頭加入 UTF-8 BOM（﻿），幫助 Word 正確判斷中文編碼。
  const blob = new Blob(["﻿", htmlString], { type: "application/msword" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ============================================================
   主流程
   ============================================================ */

function validate(data) {
  const required = [
    ["bookName", "共讀書名"],
    ["chapterNum", "篇數"],
    ["chapterTitle", "篇名"],
    ["verseRef", "聖經經節"],
    ["partner1Name", "配搭 1（主持人）姓名"],
    ["partner1Hall", "配搭 1 會所"],
    ["partner2Name", "配搭 2 姓名"],
    ["partner2Hall", "配搭 2 會所"],
    ["partner3Name", "配搭 3 姓名"],
    ["partner3Hall", "配搭 3 會所"]
  ];
  const missing = required.filter(([key]) => !data[key]).map(([, label]) => label);
  if (segments.length === 0) missing.push("至少一個段落卡片（請貼上內文自動分段或手動新增段落）");
  return missing;
}

function safeFileName(name) {
  return (name || "生命讀經共讀班逐字稿").replace(/[\\/:*?"<>|]/g, "").slice(0, 60);
}

function generateAll() {
  hideAlert();
  const data = getFormData();

  const missing = validate(data);
  if (missing.length > 0) {
    showAlert("請先確認以下項目：" + missing.join("、"));
    return;
  }

  const total = segments.reduce((sum, s) => sum + countChars(s.text), 0);
  const minutes = estimateMinutes(total);

  const btn = document.getElementById("generateBtn");
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = "⏳ 產生中，請稍候...";

  try {
    const htmlString = buildWordDocument(data, total, minutes, segments);
    const today = new Date();
    const dateStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, "0")}${String(today.getDate()).padStart(2, "0")}`;
    const fileName = `${dateStr}_${safeFileName(bookTitleDisplay(data))}.doc`;
    downloadAsWordDoc(htmlString, fileName);
  } catch (err) {
    console.error(err);
    showAlert("產生 Word 檔時發生錯誤：" + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}
</script>
